<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>body{font-family:Arial;background:#f3f6fb;display:grid;place-items:center;min-height:100vh}
.card{background:#fff;padding:28px;border-radius:14px;width:min(400px,90%);box-shadow:0 8px 30px #0001}
input{width:100%;padding:12px;margin:8px 0 14px;box-sizing:border-box}button{width:100%;padding:12px;background:#173b8f;color:#fff;border:0;border-radius:8px}</style>
</head><body><div class="card"><h2>Admin Login</h2>
<form method="post" action="/admin/login"><label>Username</label><input name="username" required>
<label>Password</label><input name="password" type="password" required><button>Login</button></form>
</div></body></html>
